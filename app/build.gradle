plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.vetplan011_wq.twa'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.vetplan011_wq.twa'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    def signingStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
    def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

    signingConfigs {
        if (signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
